[project]
name = "care-gap-navigator"
version = "0.1.0"
description = "Trust-Weighted Care Gap Navigator — Databricks Hackathon DAIS 2026, Track 2"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
