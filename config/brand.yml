# Sponsor / NGO branding. Edit here, or override per-deployment via env vars
# (BRAND_NAME, BRAND_TAGLINE, BRAND_LOGO_URL, BRAND_PRIMARY, BRAND_SECONDARY,
# BRAND_ACCENT, BRAND_BACKGROUND).
#
# All colors are hex (#RRGGBB). The Streamlit base theme picks them up via
# .streamlit/config.toml; the in-app components read them through
# app.services.brand for the inline header/footer treatments.

name: "Care Gap Navigator"
sponsor: "Virtue Foundation"
tagline: "Distinguishing real care gaps from data-poor regions across India."
logo_url: ""

# Clinical royal-blue + white palette. Confident healthcare blue, pure-white
# canvas, deep-navy ink. Accent stays in the blue family rather than the old
# amber so chrome reads as a single calm hue.
primary:    "#1e4fc2"
secondary:  "#4a7ad9"
accent:     "#1e4fc2"
background: "#ffffff"
text:       "#0f1e3d"
muted:      "#6b7385"
